name = "slovo-dano"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# API идёт через Worker, всё остальное отдаёт статика напрямую
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "slovo-dano"
# id создан командой `npx wrangler d1 create slovo-dano`
database_id = "66cb977f-ef70-4260-acaf-bb38786158b7"
migrations_dir = "migrations"
